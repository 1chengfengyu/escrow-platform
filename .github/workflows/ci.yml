name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests and web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Backend tests
        run: mvn -B -ntp test

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install web dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Build web console
        working-directory: frontend
        run: npm run build

  integration:
    name: Integration tests (MySQL + Redis)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      mysql:
        image: mysql:8.0.42
        env:
          MYSQL_ROOT_PASSWORD: dev_root
          MYSQL_DATABASE: escrow_test
          MYSQL_USER: escrow
          MYSQL_PASSWORD: dev_escrow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pdev_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - name: Start Redis
        run: docker run -d --name ci-redis -p 6379:6379 redis:7.4-alpine redis-server --requirepass dev_redis

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Integration tests
        env:
          ESCROW_IT: "true"
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          TEST_DB_NAME: escrow_test
          DB_USERNAME: escrow
          DB_PASSWORD: dev_escrow
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
          REDIS_PASSWORD: dev_redis
        run: mvn -B -ntp test