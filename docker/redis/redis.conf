# 只给本地开发用。
# 口令不写在这个文件里：compose 用 --requirepass ${REDIS_PASSWORD} 注入，
# 配置文件可以进仓库、口令留在 .env（docs/05 #25）。
bind 0.0.0.0
protected-mode yes

# VM 只有 6 GB，不设上限 Redis 会一路涨到把 MySQL 挤死。
maxmemory 128mb

# allkeys-lru 会淘汰任何 key，包括 V1 起的会话 key —— 表现为"用户莫名掉线"。
# 这是已知的设计取舍，不是 bug。要保证会话不丢：换 volatile-lru 并给会话 key 设 TTL。
maxmemory-policy allkeys-lru

# AOF 每秒刷盘：V4 的资金幂等键要跨重启存活
appendonly yes
appendfsync everysec

dir /data